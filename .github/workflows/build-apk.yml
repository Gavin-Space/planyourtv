name: Build APK

# Builds an installable APK on GitHub's runners, so a change can be tried on a
# real TV without a local JDK and Android SDK. Nothing here touches the private
# release channels: no tvApiBase, no MQTT, no official product name.
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - work/2026-11-features
      - ci/build-apk

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Assemble standard APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Debug first: it skips R8 and the dex-metadata step, so a usable APK
      # exists even if something below fails.
      - name: Assemble standardDebug
        run: ./gradlew :app:assembleStandardDebug --stacktrace

      # The release build is what the product actually ships, so build it too.
      # Without local/signing.properties it falls back to the debug key (see
      # app/build.gradle.kts), which installs fresh but cannot update an
      # existing copy. It is allowed to fail without losing the debug APK.
      - name: Assemble standardRelease
        continue-on-error: true
        run: ./gradlew :app:assembleStandardRelease --stacktrace

      - name: Collect APKs
        if: always()
        run: |
          mkdir -p out
          find app/build/outputs/apk -name '*.apk' -print -exec cp {} out/ \; || true
          ls -l out

      - name: Upload APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: planyourtv-apk-${{ github.sha }}
          path: out/*.apk
          if-no-files-found: error
          retention-days: 14

  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # A red unit test is worth seeing, but it must not hide the APK above.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run :policy:test
        run: ./gradlew :policy:test --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: policy-test-reports-${{ github.sha }}
          path: policy/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14
